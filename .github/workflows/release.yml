name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  windows:
    if: vars.RELEASES_ENABLED == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Validate release source and version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') { throw 'Only stable semantic version tags are supported' }
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version' }
          git merge-base --is-ancestor HEAD origin/master
          if ($LASTEXITCODE -ne 0) { throw 'Release commit must already be merged into master' }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build signed installer and publish release assets
        run: npm run release:win -- --config.forceCodeSigning=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
