name: Desktop release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  prepare:
    if: vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Validate release source and version
        run: |
          node scripts/release-plan.mjs prepare
          git merge-base --is-ancestor HEAD origin/master
      - name: Create or reuse an unpublished draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > release-state.json; then
            node -e 'if (!require("./release-state.json").isDraft) throw Error("Never overwrite a published release; create a new version")'
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Season Shelf $GITHUB_REF_NAME" --generate-notes
          fi
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            target: win
          - platform: macos
            os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build unsigned assets and upload to the draft
        run: npm run release:${{ matrix.target }} -- --config.publish.releaseType=draft
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Verify both platforms and publish the complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json isDraft,assets > release-state.json
          node scripts/release-plan.mjs verify
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest
