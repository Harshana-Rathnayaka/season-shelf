<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="380" viewBox="0 0 1440 380" role="img" aria-labelledby="title desc">
<title id="title">Season Shelf</title><desc id="desc">Your series, beautifully organised. A local Telegram desktop companion.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#112c28"/><stop offset="1" stop-color="#101419"/></linearGradient><linearGradient id="mint"><stop stop-color="#a0e4c6"/><stop offset="1" stop-color="#66cbda"/></linearGradient><pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#a0e4c6" stroke-opacity=".055"/></pattern></defs>
<rect width="1440" height="380" rx="24" fill="url(#bg)"/><rect width="1440" height="380" rx="24" fill="url(#grid)"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="74" y="80" fill="#a0e4c6" font-size="14" letter-spacing="5">COLLECT. WATCH. REPEAT.</text><text x="70" y="170" fill="#f1f7f5" font-size="78" font-weight="700" letter-spacing="-3">season<tspan fill="url(#mint)" font-weight="300">shelf</tspan></text><text x="74" y="225" fill="#d0e2dd" font-size="25">Your series, beautifully organised.</text><text x="74" y="268" fill="#90aba8" font-size="18">Telegram to your folders. A little less clicking.</text><rect x="74" y="302" width="114" height="30" rx="15" fill="#a0e4c6" fill-opacity=".12"/><text x="92" y="322" font-size="12" fill="#a0e4c6" letter-spacing="1">LOCAL FIRST</text><text x="210" y="322" font-size="12" fill="#90aba8" letter-spacing="1">WINDOWS DESKTOP · IN DEVELOPMENT</text></g>
<g transform="translate(1040 185)" fill="none" stroke="#a0e4c6"><ellipse rx="250" ry="95" transform="rotate(-28)" stroke-opacity=".17"/><ellipse rx="175" ry="150" transform="rotate(20)" stroke-opacity=".1"/><circle r="108" fill="#132a28" stroke-opacity=".3"/><g stroke="url(#mint)" stroke-width="5" stroke-linejoin="round"><rect x="-65" y="-57" width="25" height="102" rx="5"/><rect x="-27" y="-57" width="25" height="102" rx="5"/><rect x="20" y="-53" width="25" height="102" rx="5" transform="rotate(-12 32 0)"/><path d="M-77 64H76M-60 29H-45M-22 29H-7"/></g><circle cx="215" cy="-56" r="5" fill="#a0e4c6" stroke="none"/><circle cx="-187" cy="62" r="3" fill="#66cbda" stroke="none"/></g>
