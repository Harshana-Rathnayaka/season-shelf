.destination-hint {
  margin-left: auto;

  margin-left: auto;

.app-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 38px 20px;
  color: var(--muted);

}
.app-footer .icon {
  width: 12px;
  height: 12px;
  margin-right: 4px;
}
.app-footer b {

  border: 1px solid var(--border);

}

.simple-heading {
  padding: 16px 0 32px;
}
.simple-heading h1 {
  font-size:calc(34px * var(--font-scale, 1));
}
.empty-state {
  text-align: center;
  padding: 58px 25px 62px;
}
.empty-symbol {
  width: 60px;

  place-items: center;

}
.empty-symbol .icon {

  height: 25px;
}

}
.empty-state p {
  font-size:calc(14px * var(--font-scale, 1));

}
.empty-state > div:last-child {

}
.empty-inline {

}
.download-tabs { align-self:flex-start; flex-shrink:0; margin-bottom:12px; }
.queue-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-bottom: 24px;
}
.queue-summary > div {
  padding: 23px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
}
.queue-summary small {
  font-size:calc(11px * var(--font-scale, 1));

  color: var(--muted);
}
.queue-summary strong {
  display: block;
  font-size:calc(26px * var(--font-scale, 1));
  font-weight: 500;
  margin-top: 9px;
  letter-spacing: -0.5px;
}
.queue-item {
  display: flex;

  align-items: center;
  padding: 24px;
  border-bottom: 1px solid var(--border);
}
.queue-item:last-child {
  border: 0;
}
.queue-glyph {
  width: 42px;
  height: 44px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--tag-bg);
  color: var(--accent);
}
.queue-content {
  flex: 1;
  min-width: 0;
}
.queue-title {
  display: flex;
  gap: 15px;
  align-items: center;
  justify-content: space-between;
}
.queue-title strong {
  font-size:calc(15px * var(--font-scale, 1));
  font-weight: 500;
}
.queue-title strong span {
  font-size:calc(13px * var(--font-scale, 1));
  color: var(--muted);
  font-weight: 400;
  margin-left: 8px;
}
.queue-content p {
  font-size:calc(12px * var(--font-scale, 1));
  color: var(--muted);
  margin: 6px 0 9px;
}
.queue-content p span {
  margin: 0 6px;
}
.status {
  font-size:calc(11px * var(--font-scale, 1));

  padding: 2px 6px;
  color: var(--secondary);
}
.status-complete,
.status-downloading {
  color: var(--accent);
  background: var(--accent-soft);
  border-color: var(--accent-border);
}
.status-failed,
.status-waiting {
  color: var(--warning);
}
progress {
  display: block;
  width: 100%;
  height: 4px;
  border: 0;
  border-radius: 10px;
  overflow: hidden;
  background: var(--border);
}
progress::-webkit-progress-bar {
  background: var(--border);
}
progress::-webkit-progress-value {
  background: var(--accent);
  border-radius: 10px;
}
.job-controls {
  display: flex;
  gap: 5px;
  min-width: 36px;
}
.job-error {
  color: var(--warning);
  display: block;
  margin-top: 9px;
  font-size:calc(12px * var(--font-scale, 1));
}
.download-phase {
  display: block;
  margin-top: 8px;
  color: var(--muted);
  font-size: calc(12px * var(--font-scale, 1));
}
.download-tabs [role="tab"]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
.job-path {
  font-size:calc(11px * var(--font-scale, 1));
  color: var(--muted);
  overflow-wrap: anywhere;
  display: block;
  margin-top: 8px;
}

.settings-panel {
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
}
.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 25px;
  padding: 25px;
  border-bottom: 1px solid var(--border);
}
.setting-row > div:first-child {
  min-width: 0;
}
.setting-row h3 {
  font-size:calc(15px * var(--font-scale, 1));
  font-weight: 500;
  margin: 0 0 6px;
}
.setting-row p {
  font-size:calc(13px * var(--font-scale, 1));
  color: var(--muted);
  margin: 0;
  overflow-wrap: anywhere;
}
.segmented {
  padding: 4px;
  display: flex;
  gap: 3px;
  background: var(--subtle);
  border: 1px solid var(--border);
  border-radius: 7px;
}
.segmented button {
  background: none;
  border: 1px solid transparent;
  border-radius: 4px;
  padding: 6px 13px;
  font-size:calc(13px * var(--font-scale, 1));
  color: var(--muted);
}
.segmented button.active {
  background: var(--surface);
  color: var(--text);
  border-color: var(--border-strong);
}
select {
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  padding: 7px 24px 7px 12px;
  background: var(--surface);
  color: var(--text);
}
.settings-footnote {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 23px;
  font-size:calc(13px * var(--font-scale, 1));
  color: var(--muted);
}
.settings-footnote .icon {
  color: var(--accent);
}
dialog {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border-strong);
  border-radius: 16px;
  padding: 34px;
  width: 470px;
  max-height: 85vh;
  box-shadow: 0 24px 100px #0006;
}
dialog::backdrop {
  background: #050708a8;
  backdrop-filter: blur(5px);
}
dialog h2 {
  font-size:calc(23px * var(--font-scale, 1));
  margin: 14px 0 12px;
}
dialog p {
  font-size:calc(14px * var(--font-scale, 1));
  line-height: 1.7;
  color: var(--muted);
  margin-bottom: 22px;
}
.dialog-close {
  position: absolute;
  right: 12px;
  top: 12px;
}
.modal-icon {
  background: var(--accent-soft);
  border: 1px solid var(--accent-border);
  width: 43px;
  height: 45px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  color: var(--accent);
  margin-bottom: 20px;
}
dialog label {
  display: block;
  font-size:calc(13px * var(--font-scale, 1));
  color: var(--secondary);
  margin: 15px 0;
}
dialog input {
  display: block;
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border-strong);
  color: var(--text);
  padding: 11px 12px;
  border-radius: 6px;
  margin-top: 6px;
  font-size:calc(14px * var(--font-scale, 1));
}
.full {
  width: 100%;
  margin-top: 9px;
}
.modal-note {
  display: block;
  text-align: center;
  color: var(--muted);
  font-size:calc(12px * var(--font-scale, 1));
  margin-top: 18px;
}
.form-divider {
  text-align: center;
  font-size:calc(12px * var(--font-scale, 1)) !important;
  margin: 18px 0 5px !important;
}
.modal-search {
  display: flex;
  position: relative;
}
.modal-search .icon {
  position: absolute;
  left: 10px;
  top: 16px;
  width: 15px;
  color: var(--muted);
}
.modal-search input {
  padding-left: 34px;
}
#channel-results {
  max-height: 320px;
  overflow: auto;
  margin: 16px 0;
}
.channel-option {
  display: flex;
  gap: 13px;
  align-items: center;
  width: 100%;
  padding: 14px 10px;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--border);
  text-align: left;
  font-size:calc(14px * var(--font-scale, 1));
}
.channel-option:hover {
  background: var(--hover);
}
.channel-option > .icon:first-child {
  color: var(--accent);
}
.channel-option > .icon:last-child {
  margin-left: auto;
  width: 14px;
  color: var(--muted);
}
.discovery-results .channel-option > .icon:only-child {
  margin-left: 0;
}
#toast {
  position: fixed;
  bottom: 26px;
  left: calc(50% + 100px);
  transform: translate(-50%, 20px);
  max-width: 620px;
  background: var(--text);
  color: var(--bg);
  padding: 13px 20px;
  border-radius: 8px;
  box-shadow: 0 6px 24px #0004;
  font-size:calc(14px * var(--font-scale, 1));
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition:
    opacity 0.2s,
    transform 0.2s;
}
#toast.visible {
  opacity: 1;
  transform: translate(-50%, 0);
}
#toast.error {
  background: #e7ab90;
  color: #231910;
}
.notice,
.review-note {
  padding: 10px 24px;
  background: var(--accent-soft);
  font-size:calc(13px * var(--font-scale, 1));
  color: var(--accent);
  border: 0;
  width: 100%;
  text-align: left;
}
.review-note {
  background: var(--subtle);
  color: var(--warning);
}
.review-note .icon {
  width: 13px;
  margin-right: 5px;
}
.review-list {
  max-height: 400px;
  overflow: auto;
}
.review-list article {
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.review-list strong {
  font-size:calc(13px * var(--font-scale, 1));
  overflow-wrap: anywhere;
}
.review-list p {
  font-size:calc(12px * var(--font-scale, 1));
  margin: 5px 0;
}
.spin {
  animation: spin 1.4s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@media (max-width: 1190px) {
  .sidebar {
    width: 196px;
    padding-left: 12px;
    padding-right: 12px;
  }
  .main-shell {
    margin-left: 196px;
    width: calc(100% - 196px);
  }
  main {
    padding: 25px;
  }
  .topbar {
    padding: 0 25px;
  }
  .mode-card {
    padding: 16px 12px;
    gap: 10px;
  }
  .mode-icon {
    width: 32px;
    height: 36px;
  }
  .mode-copy strong {
    font-size:calc(14px * var(--font-scale, 1));
  }
  .mode-copy .tag {
    display: table;
    margin: 5px 0;
  }
  .mode-copy small {
    font-size:calc(11px * var(--font-scale, 1));
  }
  .season-tabs {
    gap: 13px;
  }
  .season-tab {
    font-size:calc(12px * var(--font-scale, 1));
  }
  .table-search {
    width: 130px;
  }
  .destination-hint {
    display: none;
  }
  .orbit-art {
    margin-right: 0;
  }
  .app-footer {
    padding-left: 25px;
    padding-right: 25px;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
    animation: none !important;
  }
}


.queue-summary .size-total { font-size:calc(22px * var(--font-scale, 1)); overflow-wrap:anywhere; }
.help-guide { padding:2px 6px 24px 2px; }
.help-hero { display:grid; grid-template-columns:1.2fr 1fr; gap:32px; align-items:center; padding:32px; border:1px solid var(--accent-border); border-radius:18px; background:radial-gradient(ellipse at 90% 20%,var(--accent-soft),transparent 75%),var(--surface); }
.help-kicker { display:flex; align-items:center; gap:8px; font-size:calc(10px * var(--font-scale,1)); letter-spacing:1.5px; font-weight:600; color:var(--accent); }
.help-hero h2 { margin:16px 0 12px; font-size:clamp(28px,3vw,42px); letter-spacing:-1.3px; line-height:1.12; }
.help-hero-copy > p { max-width:44ch; color:var(--secondary); margin:0 0 22px; }
.help-actions { display:flex; flex-wrap:wrap; gap:10px; }
.help-illustration { max-width:350px; width:100%; justify-self:center; border:1px solid var(--border-strong); border-radius:14px; background:var(--bg); transform:rotate(-2deg); box-shadow:8px 12px 0 var(--accent-soft); }
.help-folder-label { display:flex; align-items:center; gap:9px; padding:15px; border-bottom:1px solid var(--border); font-weight:600; }
.help-folder-label > .icon { color:var(--accent); }
.help-folder-label > span { margin-left:auto; font-size:9px; letter-spacing:1px; color:var(--muted); }
.help-folder-body { padding:16px; }
.help-season { display:flex; align-items:center; gap:8px; color:var(--secondary); font-size:13px; margin-bottom:12px; }
.help-file { display:flex; align-items:center; gap:10px; padding:12px; margin-left:14px; border-left:2px solid var(--accent-border); background:var(--surface); }
.help-file + .help-file { margin-top:8px; }
.help-file > .icon { color:var(--muted); }
.help-file small { display:block; color:var(--muted); font-size:11px; margin-top:3px; }
.help-file-check { color:var(--accent); margin-left:auto; }
.help-folder-note { display:flex; justify-content:center; gap:8px; align-items:center; padding:0 16px 16px; color:var(--secondary); font-size:12px; }
.help-section-heading { display:flex; justify-content:space-between; align-items:end; gap:12px; margin:28px 0 14px; }
.help-section-heading h2 { font-size:calc(19px * var(--font-scale,1)); margin:6px 0 0; letter-spacing:-.35px; }
.help-section-note { font-size:12px; color:var(--muted); }
.help-steps { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; list-style:none; margin:0; padding:0; }
.help-step { display:flex; flex-direction:column; padding:20px; border:1px solid var(--border); border-radius:14px; background:var(--surface); }
.help-step-top { display:flex; align-items:center; justify-content:space-between; }
.help-step-icon { display:grid; place-items:center; width:38px; height:38px; border:1px solid var(--accent-border); border-radius:11px; background:var(--accent-soft); color:var(--accent); }
.help-step-number { color:var(--muted); font-size:22px; font-weight:300; }
.help-step h3 { font-size:calc(16px * var(--font-scale,1)); margin:16px 0 8px; }
.help-step > p { color:var(--secondary); font-size:calc(13px * var(--font-scale,1)); margin:0 0 18px; }
.help-step-tip { display:flex; align-items:flex-start; gap:8px; margin-top:auto; padding-top:12px; border-top:1px solid var(--border); color:var(--muted); font-size:calc(12px * var(--font-scale,1)); }
.help-step-tip .icon { width:15px; height:15px; margin-top:2px; }
.help-folder-choices { display:grid; grid-template-columns:1fr 1fr; gap:24px; padding:18px 22px; margin-top:14px; border:1px solid var(--border); border-radius:12px; background:var(--subtle); }
.help-folder-choices > div { display:flex; align-items:center; gap:12px; }
.help-folder-choices > div > .icon { color:var(--accent); }
.help-folder-choices strong { display:block; font-size:calc(13px * var(--font-scale,1)); }
.help-folder-choices small { display:block; color:var(--secondary); margin-top:3px; }
.help-faq { border:1px solid var(--border); border-radius:14px; background:var(--surface); overflow:hidden; }
.help-faq details + details { border-top:1px solid var(--border); }
.help-faq summary { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:17px 20px; cursor:pointer; font-weight:500; list-style:none; }

.help-faq details p { max-width:85ch; margin:0; padding:0 20px 20px; color:var(--secondary); font-size:calc(13px * var(--font-scale,1)); line-height:1.7; }
.help-bottom-note { display:flex; gap:12px; align-items:center; padding:20px 4px 0; color:var(--muted); }

.help-bottom-note .text-button { flex-shrink:0; }
@media (max-width:1100px) {
  .help-hero { padding:24px; gap:24px; grid-template-columns:1.1fr 1fr; }
  .help-step { padding:16px; }
  .help-section-note { display:none; }
}
@media (max-width:850px) {
  .help-hero { grid-template-columns:1fr; }
  .help-illustration { transform:none; }
  .help-steps,.help-folder-choices { grid-template-columns:1fr; }
  .help-bottom-note { flex-wrap:wrap; }
}
.job-controls { flex-wrap:wrap; }


/* Compact library controls and a readable system type scale. */
body { font-feature-settings: "cv11", "ss01"; }
h1, h2, h3 { font-weight: 600; }
.library-preferences { display:flex; align-items:center; flex-wrap:wrap; gap:16px; margin:0 0 20px; }
.mode-switch { display:inline-flex; gap:4px; padding:4px; border:1px solid var(--border); background:var(--subtle); border-radius:11px; }
.mode-switch button { display:flex; align-items:center; justify-content:center; gap:8px; min-height:36px; padding:6px 18px; border:1px solid transparent; border-radius:7px; color:var(--secondary); background:transparent; font-size:calc(14px * var(--font-scale, 1)); font-weight:600; }
.mode-switch button .icon { width:16px; height:16px; }
.mode-switch button.active { background:var(--surface); border-color:var(--border-strong); color:var(--accent); box-shadow:0 1px 3px #0002; }
.mode-description { color:var(--secondary); font-size:calc(13px * var(--font-scale, 1)); }
.quality-toolbar { display:flex; flex-wrap:wrap; gap:16px 24px; align-items:center; padding:14px 24px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); background:var(--subtle); }
.quality-group { display:flex; align-items:center; gap:12px; }
.quality-label { color:var(--secondary); font-size:calc(12px * var(--font-scale, 1)); font-weight:600; }
.quality-segments { display:flex; flex-wrap:wrap; gap:4px; }
.quality-chip { min-height:34px; min-width:55px; border:1px solid transparent; border-radius:7px; padding:6px 11px; font-size:calc(13px * var(--font-scale, 1)); font-weight:600; color:var(--secondary); background:transparent; font-variant-numeric:tabular-nums; }
.quality-chip:hover, .mode-switch button:hover { background:var(--hover); color:var(--text); }
.quality-chip[aria-pressed="true"] { color:var(--accent); border-color:var(--accent-border); background:var(--accent-soft); }
.quality-chip:focus-visible, .mode-switch button:focus-visible { outline-offset:2px; }
.codec-group { border-left:1px solid var(--border-strong); padding-left:24px; }
.quality-hint { display:flex; align-items:center; gap:6px; margin-left:auto; color:var(--muted); font-size:calc(12px * var(--font-scale, 1)); }
.quality-hint .icon { width:14px; height:14px; }
.quality-fallback, .quality-empty { padding:10px 24px; color:var(--secondary); background:var(--subtle); font-size:calc(13px * var(--font-scale, 1)); line-height:1.5; }
.episode-table table { table-layout:fixed; }
.episode-table th:nth-child(3) { width:122px; }
.episode-table th:last-child { width:110px; }
.episode-table td { padding-top:17px; padding-bottom:17px; }
.episode-title { align-items:flex-start; }
.episode-copy { min-width:0; }
.episode-title strong { font-size:calc(15px * var(--font-scale, 1)); font-weight:600; line-height:1.4; }
.episode-number { flex-shrink:0; margin-top:2px; }
.source-filename { display:block; color:var(--secondary); font-size:calc(12px * var(--font-scale, 1)); line-height:1.55; font-weight:400; overflow-wrap:anywhere; user-select:text; margin-top:5px; letter-spacing:0; }
.episode-title small { font-size:calc(12px * var(--font-scale, 1)); margin-top:5px; }
.quality-tag, .codec, .file-size { font-size:calc(12px * var(--font-scale, 1)); }
.queue-filename { margin-top:7px; }
.panel-title p, .table-search input, .season-tab { font-size:calc(13px * var(--font-scale, 1)); }
.panel-title { min-width:0; }

}

.page-header p { margin:6px 0 0; color:var(--secondary); font-size:calc(13px * var(--font-scale,1)); line-height:1.5; }
.page-header-actions { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
.workspace-shell .queue-summary > div { height:auto; min-height:88px; }
.workspace-shell .queue-summary small { letter-spacing:1px; }
.queue-actions { gap:8px; margin-bottom:12px; }
.queue-actions .button { min-height:36px; padding:7px 12px; }
.workspace-shell .job-controls { gap:8px; }
.job-controls .icon-button { min-width:36px; min-height:36px; }
.row-actions, .dialog-actions, .help-actions { column-gap:10px; row-gap:10px; }
.settings-group { max-width:1120px; margin-inline:auto; padding:24px 28px; }
.settings-group p { max-width:76ch; line-height:1.65; }
.settings-group > h2 { padding-bottom:10px; }
.settings-group .setting-row { gap:20px 32px; }
.settings-group .setting-row > div:first-child { flex-basis:360px; }
.help-hero { background:var(--surface); border-color:var(--border); border-radius:12px; padding:24px; }
.help-hero h2 { font-size:calc(25px * var(--font-scale,1)); letter-spacing:-.5px; margin-top:0; }
.help-step { border-radius:10px; }
#dialog .dialog-actions > .button { min-height:38px; }
@media (max-width:1000px) {
  .workspace-shell .topbar { padding-inline:16px; }
  .settings-group { padding:20px; }
  .page-header p { max-width:65ch; }
}
@media (max-height:780px) {
  .workspace-shell .page-header { min-height:60px; margin-bottom:8px; padding:4px 0; }
  .workspace-shell .page-header h1 { font-size:calc(22px * var(--font-scale,1)); }
  .workspace-shell .queue-summary > div { min-height:80px; }
}
@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after { scroll-behavior:auto !important; transition:none !important; }
}

/* Final interaction and hierarchy layer. Feature styles remain responsible for layout. */
:root {
  --radius-sm: 7px;
  --radius-md: 11px;
  --radius-lg: 16px;
  --shadow-float: 0 18px 55px #05070852;
  --shadow-soft: 0 1px 2px #05070830, 0 8px 24px #05070812;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
}

body {
  background:
    radial-gradient(900px 480px at 88% -12%, var(--accent-soft), transparent 68%),
    var(--bg);
}

* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: var(--border-strong); border: 3px solid transparent; border-radius: 999px; background-clip: padding-box; }

.workspace-shell main { animation: page-in .24s var(--ease-out) both; }
@keyframes page-in {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.topbar {
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px);
}
.breadcrumb { letter-spacing: -.1px; }
.breadcrumb strong { color: var(--text); }
.connection { border-radius: var(--radius-sm); }
.connection:hover { border-color: var(--border-strong); background: var(--hover); }

.nav-item { position: relative; border-radius: var(--radius-sm); }
.nav-item.active::before {
  content: "";
  position: absolute;
  left: -7px;
  width: 3px;
  height: 20px;
  border-radius: 999px;
  background: var(--accent);
}
.sidebar-collapsed .nav-item.active::before { left: -5px; }

.catalogue-panel,
.settings-panel,
.help-faq,
.help-step,
.queue-summary > div {
  box-shadow: var(--shadow-soft);
}
.catalogue-panel,
.settings-panel { border-radius: var(--radius-md); }

.button { min-height: 38px; border-radius: var(--radius-sm); transition: background .16s, border-color .16s, color .16s, box-shadow .16s, transform .16s var(--ease-out); }
.button:hover:not(:disabled) { transform: translateY(-1px); }
.button.primary { box-shadow: 0 5px 16px color-mix(in srgb, var(--accent) 20%, transparent); }
.button.primary:hover:not(:disabled) { box-shadow: 0 7px 20px color-mix(in srgb, var(--accent) 28%, transparent); }
.button.secondary:hover:not(:disabled) { box-shadow: 0 4px 12px #05070818; }
.text-button { border-radius: var(--radius-sm); }
.text-button:hover:not(:disabled) { background: var(--accent-soft); }
.icon-button { transition: background .16s, border-color .16s, color .16s, transform .16s var(--ease-out); }
.icon-button:hover:not(:disabled) { transform: translateY(-1px); }

.queue-summary > div {
  position: relative;
  overflow: hidden;
  transition: border-color .18s, transform .18s var(--ease-out);
}
.queue-summary > div::after {
  content: "";
  position: absolute;
  inset: auto 16px 0;
  height: 2px;
  border-radius: 999px 999px 0 0;
  background: var(--accent);
  opacity: .35;
}
.queue-summary > div:hover { border-color: var(--border-strong); transform: translateY(-1px); }
.queue-summary strong { font-variant-numeric: tabular-nums; }

.queue-item {
  position: relative;
  transition: background .18s, border-color .18s;
  animation: queue-item-in .2s var(--ease-out) both;
}
@keyframes queue-item-in { from { opacity: 0; transform: translateY(5px); } }
.queue-item:hover { background: color-mix(in srgb, var(--hover) 55%, transparent); }
.queue-item[data-status="downloading"]::before {
  content: "";
  position: absolute;
  inset: 10px auto 10px 0;
  width: 2px;
  border-radius: 0 999px 999px 0;
  background: var(--accent);
}
.queue-item[data-status="failed"]::before,
.queue-item[data-status="waiting"]::before {
  content: "";
  position: absolute;
  inset: 10px auto 10px 0;
  width: 2px;
  background: var(--warning);
}
.queue-glyph { transition: color .18s, border-color .18s, background .18s; }
.queue-item:hover .queue-glyph { border-color: var(--accent-border); background: var(--accent-soft); }
.status { font-weight: 600; letter-spacing: .1px; }
.status-downloading::before {
  content: "";
  display: inline-block;
  width: 5px;
  height: 5px;
  margin: 0 5px 1px 0;
  border-radius: 50%;
  background: currentColor;
  animation: status-pulse 1.5s ease-in-out infinite;
}
@keyframes status-pulse { 50% { opacity: .35; transform: scale(.75); } }

.episode-table tbody tr { transition: background .14s, box-shadow .14s; }
.episode-table tbody tr.row-selected { box-shadow: inset 2px 0 var(--accent); }
.mode-switch,
.library-list-switch,
.segmented,
.channel-filter-switch { box-shadow: inset 0 1px 2px #05070816; }

.notice[role="status"] { position: relative; overflow: hidden; }
.notice[role="status"]::after {
  content: "";
  position: absolute;
  inset: auto 0 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  animation: scan-line 1.5s var(--ease-out) infinite;
}
@keyframes scan-line { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

dialog {
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-float);
  opacity: 1;
  transform: translateY(0) scale(1);
  transition: opacity .2s, transform .24s var(--ease-out), display .2s allow-discrete, overlay .2s allow-discrete;
}
dialog::backdrop { opacity: 1; transition: opacity .2s, display .2s allow-discrete, overlay .2s allow-discrete; }
@starting-style {
  dialog[open] { opacity: 0; transform: translateY(10px) scale(.985); }
  dialog[open]::backdrop { opacity: 0; }
}
.dialog-close { border-radius: 10px; }
.dialog-actions { padding-top: 2px; }
.channel-option { border-radius: var(--radius-sm); transition: background .14s, color .14s, transform .14s var(--ease-out); }
.channel-option:hover { transform: translateX(2px); }

.account-popover { transform-origin: left bottom; animation: popover-in .18s var(--ease-out) both; }
@keyframes popover-in { from { opacity: 0; transform: translateY(6px) scale(.98); } }

.control-tooltip {
  z-index: 120;
  max-width: 260px;
  padding: 7px 10px;
  border: 1px solid var(--border-strong);
  border-radius: 7px;
  background: var(--text);
  color: var(--bg);
  box-shadow: var(--shadow-soft);
  font-size: calc(12px * var(--font-scale, 1));
  line-height: 1.35;
  animation: tooltip-in .14s var(--ease-out) both;
}
.control-tooltip-arrow { fill: var(--text); }
@keyframes tooltip-in { from { opacity: 0; transform: translateY(2px) scale(.98); } }

#toast { border: 1px solid color-mix(in srgb, var(--bg) 18%, transparent); box-shadow: var(--shadow-float); }
.empty-symbol { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 6%, transparent); }
.empty-inline .text-button { margin-left: 4px; padding-block: 4px; }

@media (prefers-reduced-motion: reduce) {
  .workspace-shell main,
  .queue-item,
  .account-popover,
  .status-downloading::before,
  .notice[role="status"]::after,
  .control-tooltip { animation: none; }
  dialog { transition: none; }
}
